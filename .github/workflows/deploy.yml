name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time; a queued run supersedes an older one rather
# than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The export records the commit it came from.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies to install. The whole toolchain is Node's standard
      # library, which is why there is no lockfile and no npm ci step.

      # One gate, and the same one `npm test` runs.
      #
      # This step used to be five steps naming individual scripts, and that
      # list had drifted from the one in package.json in both directions: CI
      # was missing the calendar, publication-floor, jurisdiction and release
      # checks that npm test also missed, plus the probe, sourcing, credential,
      # map and imagery checks that npm test did run. Every one of them passed
      # when run by hand, which is why nothing ever drew attention to it.
      #
      # scripts/lib/quality-gate.mjs is now the only list, and
      # scripts/test-quality-gate.mjs fails if this file starts naming scripts
      # again.
      - name: Quality gate
        env:
          SITE_BASE: /IB-Post-Secondary-Opportunities
          SITE_ORIGIN: https://rktrobinhood.github.io
        run: node scripts/qa.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
