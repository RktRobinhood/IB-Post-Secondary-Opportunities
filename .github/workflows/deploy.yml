name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time; a queued run supersedes an older one rather
# than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD identifies the export; old QA blobs need not be fetched.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Image checks use sharp; the static generator uses Node's standard library.
      - name: Install devDependencies
        run: npm install --no-package-lock --no-audit --no-fund

      # CI always checks all data and all built pages, including school-only PRs.
      - name: Quality gate
        env:
          SITE_BASE: /IB-Post-Secondary-Opportunities
          SITE_ORIGIN: https://rktrobinhood.github.io
        run: npm run check -- --full

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
